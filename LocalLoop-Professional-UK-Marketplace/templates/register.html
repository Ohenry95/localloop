{% extends 'base.html' %}{% block robots %}noindex,nofollow{% endblock %}{% block title %}Create account — LocalLoop{% endblock %}{% block content %}<section class="auth-wrap"><div class="auth-card"><div class="eyebrow">WELCOME TO THE LOOP</div><h1>Good to have you.</h1><p class="muted">Create an account to save your local finds and manage vouchers.</p><form method="post" class="form-stack"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Your name<input name="name" required maxlength="100" autocomplete="name"></label><label>Email address<input type="email" name="email" required maxlength="254" autocomplete="email"></label><label>Password<input type="password" name="password" required minlength="12" maxlength="256" autocomplete="new-password"><small>Use at least 12 characters.</small></label><button class="button full">Create account</button></form><p class="muted">Already joined? <a href="{{ url_for('login') }}">Sign in</a></p></div></section>{% endblock %}
